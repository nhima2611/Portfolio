    <style>
      /* Shown until the 3D scene draws its first frame; styles.css loads with the JS bundle, so these live inline. */
      html, body { background: #12151d; }
      .boot {
        position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
        background: #12151d; color: #9aa0ad; font: 400 13px ui-monospace, Menlo, monospace;
        transition: opacity 0.6s, visibility 0.6s;
      }
      .boot b { color: #eceae4; font-weight: 400; }
      .boot b span { color: #ffb46b; }
      .boot i { display: inline-block; width: 8px; height: 14px; margin-left: 4px; vertical-align: -2px; background: #ffb46b; animation: boot-blink 1s steps(1) infinite; }
      @keyframes boot-blink { 50% { opacity: 0; } }
      .booted .boot { opacity: 0; visibility: hidden; }
      @media (prefers-reduced-motion: reduce) { .boot i { animation: none; } }
    </style>
  </head>
  <body>
    <div class="boot" aria-hidden="true"><p><b>nhi<span>@</span>desk</b> ~ booting<i></i></p></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
